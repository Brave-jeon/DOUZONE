# Free compute only. No paid disk. Encrypted account state uses Supabase Free PostgreSQL.
services:
  - type: web
    name: salespilot-free-shared-login
    runtime: docker
    repo: https://github.com/Brave-jeon/DOUZONE
    branch: shared-login-free-20261112
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/status
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_DATA_DIR
        value: /tmp/salespilot
      - key: PORT
        value: '10000'
      - key: MIGRATION_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORE_ENCRYPTION_KEY
        sync: false
